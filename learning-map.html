<style>
/* journey diagram */
.journey-fig { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); padding: 16px; margin: 18px 0 10px; box-shadow: var(--shadow-sm); overflow-x: auto; }
.journey-fig svg { width: 100%; min-width: 760px; height: auto; display: block; font-family: var(--font-display), 'Noto Sans TC', sans-serif; }
.journey-fig svg a { cursor: pointer; }
.journey-fig svg a:hover .blk { filter: brightness(0.96); }
.journey-fig svg a:hover text { text-decoration: underline; }
.jf-cap { font-size: 13px; color: var(--ink-2); text-align: center; margin-top: 4px; }
.jf-cap b { color: var(--ink); }

.flow-dash { stroke-dasharray: 5 6; animation: flowmove 1.1s linear infinite; }
@keyframes flowmove { to { stroke-dashoffset: -22; } }

/* legend */
.zleg { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 4px 0 6px; }
.zleg span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.zleg i { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }

/* station layer heading */
.layer-h { display: flex; align-items: center; gap: 11px; margin: 34px 0 6px; }
.layer-h .lh-tag { font-family: var(--font-mono); font-weight: 700; font-size: 11px; color: #fff; padding: 4px 12px; border-radius: var(--r-pill); white-space: nowrap; }
.layer-h h2 { font-family: var(--font-display); font-weight: 800; font-size: 21px; color: var(--ink); }
.layer-h .rule { flex: 1; height: 2px; border-radius: 2px; }
.layer-sub { font-size: 13.5px; color: var(--ink-2); margin: 0 0 14px; }

/* station cards */
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mcard { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--mc, var(--teal)); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
.mcard .mc-st { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--mc, var(--teal-ink)); letter-spacing: .5px; }
.mcard h3 { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); margin: 3px 0 8px; }
.mcard .mc-what { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
.mcard .mc-check { font-size: 12.5px; color: var(--ink-2); background: var(--surface-soft); border-left: 3px solid var(--mc, var(--teal)); border-radius: var(--r-sm); padding: 8px 11px; margin: 11px 0; line-height: 1.6; }
.mcard .mc-check b { color: var(--mc, var(--teal-ink)); font-weight: 700; }
.mcard .mc-tools { display: flex; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.mcard .mc-tool { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--mc, var(--teal-ink)); text-decoration: none; background: var(--mc-soft, var(--teal-soft)); border: 1px solid transparent; border-radius: var(--r-pill); padding: 5px 12px; }
.mcard .mc-tool:hover { border-color: var(--mc, var(--teal)); }
.mcard .mc-tool svg { width: 13px; height: 13px; }
.mcard .mc-ext { font-size: 11.5px; color: var(--ink-3); margin-top: 9px; }
.mcard .mc-ext b { color: var(--ink-2); }
.mc-star { color: var(--honey); }
</style>

function render(){
  const root = document.getElementById('stations');
  LAYERS.forEach(L => {
    const h = document.createElement('div');
    h.className = 'layer-h';
    h.innerHTML = `<span class="lh-tag" style="background:${L.color}">${L.tag}</span>`
      + `<h2>${L.name}</h2><span class="rule" style="background:${L.soft}"></span>`;
    root.appendChild(h);
    const sub = document.createElement('p');
    sub.className = 'layer-sub';
    sub.textContent = L.sub;
    root.appendChild(sub);

    const grid = document.createElement('div');
    grid.className = 'mcards';
    STATIONS.filter(s => s.layer === L.key).forEach(s => {
      const card = document.createElement('div');
      card.className = 'mcard';
      card.style.setProperty('--mc', L.color);
      card.style.setProperty('--mc-soft', L.soft);
      const tools = s.tools.map(t =>
        `<a class="mc-tool" href="${t[1]}"><i data-lucide="${t[2]}"></i> ${t[0]}</a>`).join('');
      card.innerHTML =
        `<div class="mc-st">${s.st}</div>`
        + `<h3>${s.title}${s.star ? ' <span class="mc-star" title="二等大題">★</span>' : ''}</h3>`
        + `<div class="mc-what">${s.what}</div>`
        + `<div class="mc-check"><b>自我檢查：</b>${s.check}</div>`
        + `<div class="mc-tools">${tools}</div>`
        + (s.ext ? `<div class="mc-ext">${s.ext}</div>` : '');
      grid.appendChild(card);
    });
    root.appendChild(grid);
  });
  if (window.lucide) lucide.createIcons();
}
render();
</script>
</body>
</html>
