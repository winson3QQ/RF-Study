<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業餘頻段互動頻譜 — 二等業餘無線電</title>
<link rel="icon" href="../assets/logo-mark.svg">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<script>window.SITE_SECTION = 'tools';</script>

<div class="wrap wrap-narrow">

  <div class="read-top">
    <a class="back-btn" href="../index.html"><i data-lucide="arrow-left"></i> 回首頁</a>
  </div>

  <div class="tool-title">業餘頻段互動頻譜 📊</div>
  <p class="tool-sub">對應「無線電規章與相關法規」題庫 · 點擊頻段查看詳細規定。</p>

  <div class="emerg">
    <i data-lucide="alert-triangle"></i>
    <div><b>緊急救難頻率：</b> 145 MHz 及 433 MHz 為呼叫及緊急救難頻率，任何電臺呼叫完畢後須改換他頻，<b>不得停留佔用及干擾</b>。</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchView('spectrum', this)"><i data-lucide="chart-spline"></i> 視覺頻譜</button>
    <button class="tab" onclick="switchView('table', this)"><i data-lucide="table"></i> 完整列表</button>
    <button class="tab" onclick="switchView('calc', this)"><i data-lucide="search"></i> 頻率查詢</button>
  </div>

  <!-- SPECTRUM VIEW -->
  <div id="view-spectrum">
    <div class="legend">
      <div class="leg"><span class="sw mode-cw"></span>電報/數據</div>
      <div class="leg"><span class="sw mode-data"></span>數據/無線打字</div>
      <div class="leg"><span class="sw mode-phone"></span>電話/影像</div>
      <div class="leg"><span class="sw mode-emerg"></span>緊急/救難</div>
    </div>

    <div class="panel">
      <div class="panel-h"><i data-lucide="radio"></i> HF 頻段（點擊任一頻段查看詳細規定）</div>
      <div id="hf-spectrum"></div>
      <div class="panel-h" style="margin-top:22px"><i data-lucide="radio-tower"></i> VHF / UHF 頻段</div>
      <div id="vhf-spectrum"></div>
    </div>

    <div class="detail" id="detail-panel" style="display:none">
      <div class="detail-h">
        <div>
          <div class="detail-freq" id="dp-freq"></div>
          <div class="detail-name" id="dp-name"></div>
        </div>
        <div class="detail-grades" id="dp-grades"></div>
      </div>
      <div class="detail-grid" id="dp-grid"></div>
      <div class="modes" id="dp-modes"></div>
    </div>
  </div>

  <!-- TABLE VIEW -->
  <div id="view-table" style="display:none">
    <table class="tbl">
      <thead>
        <tr>
          <th>頻段 (MHz)</th>
          <th>俗稱</th>
          <th>一等功率</th>
          <th>二等功率</th>
          <th>三等功率</th>
          <th>允許發射方式</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- FREQ CALC VIEW -->
  <div id="view-calc" style="display:none">
    <div class="utog">
      <button class="b on" id="ut-khz" onclick="setFcUnit('kHz')">kHz</button>
      <button class="b" id="ut-mhz" onclick="setFcUnit('MHz')">MHz</button>
    </div>
    <div class="field">
      <label>輸入頻率</label>
      <input type="number" id="fc-freq" placeholder="例：14200" oninput="lookupFreq()" step="any">
      <div class="unit" id="fc-unit">kHz</div>
    </div>
    <div class="result" id="fc-result" style="display:none">
      <div class="rfreq" id="fc-freq-display"></div>
      <div class="rdet" id="fc-detail"></div>
      <div class="rmatch" id="fc-match"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../assets/js/nav.js"></script>
<script>
// ═══ DATA ═══
const bands = [
  { freq: '0.1357-0.1378 MHz', mhzLow: 0.1357, mhzHigh: 0.1378, name: '136kHz 低頻', meters: '2200m', pw1: '1W↓ EIRP', pw2: '1W↓ EIRP', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, special: '超長波，極少使用' },
  { freq: '1.8-1.9 MHz', mhzLow: 1.8, mhzHigh: 1.9, name: '160 公尺頻段', meters: '160m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '3.5-3.5125 MHz', mhzLow: 3.5, mhzHigh: 3.5125, name: '80 公尺頻段（下段）', meters: '80m', pw1: '1500W↓', pw2: '200W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '3.55-3.5625 MHz', mhzLow: 3.55, mhzHigh: 3.5625, name: '80 公尺頻段（上段）', meters: '80m', pw1: '1500W↓', pw2: '200W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '7.0-7.025 MHz', mhzLow: 7.0, mhzHigh: 7.025, name: '40 公尺頻段（下段）', meters: '40m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '7.025-7.2 MHz', mhzLow: 7.025, mhzHigh: 7.2, name: '40 公尺頻段（上段）', meters: '40m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '10.13-10.15 MHz', mhzLow: 10.13, mhzHigh: 10.15, name: '30 公尺頻段', meters: '30m', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務及影像' },
  { freq: '14.0-14.35 MHz', mhzLow: 14.0, mhzHigh: 14.35, name: '20 公尺頻段', meters: '20m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '18.068-18.168 MHz', mhzLow: 18.068, mhzHigh: 18.168, name: '17 公尺頻段', meters: '17m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '21.0-21.025 MHz', mhzLow: 21.0, mhzHigh: 21.025, name: '15 公尺頻段（下段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '21.025-21.2 MHz', mhzLow: 21.025, mhzHigh: 21.2, name: '15 公尺頻段（中段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false },
  { freq: '21.2-21.45 MHz', mhzLow: 21.2, mhzHigh: 21.45, name: '15 公尺頻段（上段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '24.89-24.99 MHz', mhzLow: 24.89, mhzHigh: 24.99, name: '12 公尺頻段', meters: '12m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '28.0-29.7 MHz', mhzLow: 28.0, mhzHigh: 29.7, name: '10 公尺頻段', meters: '10m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','調頻電話','電話','影像','無線打字','數據','示標','中繼','衛星業餘'], grade3: false },
  { freq: '50.0-50.15 MHz', mhzLow: 50.0, mhzHigh: 50.15, name: '6 公尺頻段', meters: '6m', pw1: '1500W↓', pw2: '600W↓', pw3: '25W↓', modes: ['電報','調變電報','電話','影像','無線打字','數據','衛星業餘'], grade3: true },
  { freq: '144-146 MHz', mhzLow: 144, mhzHigh: 146, name: '2 公尺頻段', meters: '2m', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['電報','調變電報','電話(SSB)','影像','無線打字','數據','EME','測試','衛星業餘'], grade3: true, emerg: 145 },
  { freq: '430-432 MHz', mhzLow: 430, mhzHigh: 432, name: '70 公分頻段（下段）', meters: '70cm', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['電報','調變電報','電話(SSB)','影像','無線打字','數據','展頻','EME','測試'], grade3: true },
  { freq: '432-440 MHz', mhzLow: 432, mhzHigh: 440, name: '70 公分頻段（上段）', meters: '70cm', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['調變電報','電話','影像','無線打字','數據','展頻','EME','緊急/求救','中繼','衛星業餘'], grade3: true, emerg: 433 },
  { freq: '1260-1265 MHz', mhzLow: 1260, mhzHigh: 1265, name: '23 公分頻段', meters: '23cm', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','調變電報','電話','影像','無線打字','數據','展頻','測試','衛星業餘'], grade3: false },
  { freq: '2440-2450 MHz', mhzLow: 2440, mhzHigh: 2450, name: '13 公分頻段', meters: '13cm', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','調變電報','電話','影像','無線打字','數據','展頻','測試','脈衝','衛星業餘'], grade3: false },
];

const hfBands = bands.filter(b => b.mhzHigh <= 30);
const vhfBands = bands.filter(b => b.mhzLow >= 50);

function getModeClass(band) {
  const m = band.modes;
  if (band.emerg) return 'mode-emerg';
  if (m.includes('電話') || m.includes('電話(SSB)') || m.includes('影像')) return 'mode-phone';
  if (m.includes('數據') && !m.includes('電話')) return 'mode-data';
  return 'mode-cw';
}

function buildSpectrumRow(band, container) {
  const row = document.createElement('div');
  row.className = 'band-row';

  const label = document.createElement('div');
  label.className = 'band-label';
  label.textContent = band.meters;

  const track = document.createElement('div');
  track.className = 'band-track';

  const seg = document.createElement('div');
  seg.className = 'band-seg ' + getModeClass(band);
  seg.textContent = band.freq;
  track.onclick = () => showDetail(band);
  track.appendChild(seg);

  const info = document.createElement('div');
  info.className = 'band-info';
  info.textContent = '2等 ' + band.pw2;

  row.appendChild(label);
  row.appendChild(track);
  row.appendChild(info);
  container.appendChild(row);
}

function buildSpectrums() {
  const hfEl = document.getElementById('hf-spectrum');
  const vhfEl = document.getElementById('vhf-spectrum');
  hfBands.forEach(b => buildSpectrumRow(b, hfEl));
  vhfBands.forEach(b => buildSpectrumRow(b, vhfEl));
}

function showDetail(band) {
  const panel = document.getElementById('detail-panel');
  panel.style.display = 'block';

  document.getElementById('dp-freq').textContent = band.freq;
  document.getElementById('dp-name').textContent = band.name + (band.emerg ? ' ⚠ 含緊急頻率' : '');

  const gradesEl = document.getElementById('dp-grades');
  gradesEl.innerHTML = '';
  const g1 = document.createElement('div'); g1.className='gbadge g1'; g1.textContent='一等'; gradesEl.appendChild(g1);
  const g2 = document.createElement('div'); g2.className='gbadge g2'; g2.textContent='二等'; gradesEl.appendChild(g2);
  if (band.grade3) { const g3 = document.createElement('div'); g3.className='gbadge g3'; g3.textContent='三等'; gradesEl.appendChild(g3); }

  const grid = document.getElementById('dp-grid');
  grid.innerHTML = '';
  const cells = [
    { label: '一等功率', val: band.pw1, cls: '' },
    { label: '二等功率', val: band.pw2, cls: 'hl' },
    { label: '三等功率', val: band.grade3 ? band.pw3 : '不得使用', cls: '' },
    { label: '頻段寬度', val: ((band.mhzHigh - band.mhzLow) * 1000).toFixed(1) + ' kHz', cls: 'hl' },
    { label: '波段俗稱', val: band.meters, cls: '' },
    { label: '功率基準', val: band.mhzLow < 0.2 ? 'EIRP' : 'PEP', cls: '' },
  ];
  cells.forEach(c => {
    const cell = document.createElement('div'); cell.className='dcell';
    cell.innerHTML = `<div class="l">${c.label}</div><div class="v ${c.cls}">${c.val}</div>`;
    grid.appendChild(cell);
  });

  const modesEl = document.getElementById('dp-modes');
  modesEl.innerHTML = '';
  band.modes.forEach(m => {
    const tag = document.createElement('span');
    tag.className = 'mtag';
    tag.textContent = m;
    modesEl.appendChild(tag);
  });

  if (band.restriction) {
    const note = document.createElement('div');
    note.className = 'callout warn';
    note.style.width = '100%';
    note.innerHTML = '<span class="ct">⚠ 限制</span>' + band.restriction;
    modesEl.appendChild(note);
  }

  if (band.emerg) {
    const note = document.createElement('div');
    note.className = 'callout warn';
    note.style.width = '100%';
    note.innerHTML = `<span class="ct">⚠ 緊急救難</span>${band.emerg} MHz 為緊急救難呼叫頻率，呼叫後立即移頻，不得停留。`;
    modesEl.appendChild(note);
  }

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  bands.forEach(b => {
    const tr = document.createElement('tr');
    const modesStr = b.modes.join('、');
    const restrict = b.restriction ? `<br><span style="color:var(--rose-ink)">⚠ ${b.restriction}</span>` : '';
    const emergNote = b.emerg ? `<br><span style="color:var(--rose-ink)">⚠ ${b.emerg}MHz 緊急頻率</span>` : '';
    tr.innerHTML = `
      <td><span style="font-family:var(--font-mono);color:var(--primary-ink)">${b.freq}</span></td>
      <td><span style="color:var(--ink-3);font-family:var(--font-mono)">${b.meters}</span> ${b.name}</td>
      <td style="font-family:var(--font-mono)">${b.pw1}</td>
      <td style="font-family:var(--font-mono);color:var(--primary-ink);font-weight:700">${b.pw2}</td>
      <td style="font-family:var(--font-mono)">${b.grade3 ? b.pw3 : '<span style="color:var(--ink-3)">不可用</span>'}</td>
      <td style="font-size:12px;color:var(--ink-2)">${modesStr}${restrict}${emergNote}</td>
    `;
    tr.onclick = () => { switchView('spectrum'); showDetail(b); };
    tr.style.cursor = 'pointer';
    tbody.appendChild(tr);
  });
}

let fcUnit = 'kHz';
function setFcUnit(u) {
  fcUnit = u;
  document.getElementById('ut-khz').classList.toggle('on', u === 'kHz');
  document.getElementById('ut-mhz').classList.toggle('on', u === 'MHz');
  document.getElementById('fc-unit').textContent = u;
  lookupFreq();
}

function lookupFreq() {
  const raw = parseFloat(document.getElementById('fc-freq').value);
  const res = document.getElementById('fc-result');
  if (isNaN(raw)) { res.style.display='none'; return; }

  const mhz = fcUnit === 'kHz' ? raw / 1000 : raw;
  const khz = mhz * 1000;

  let freqStr = mhz >= 1 ? `${mhz.toFixed(3)} MHz` : `${khz.toFixed(3)} kHz`;
  const lambda = (300 / mhz).toFixed(2);

  let matchText = '<span class="match-no">✗ 此頻率不在台灣二等業餘分配頻段內</span>';
  let detailText = '';

  const match = bands.find(b => mhz >= b.mhzLow && mhz <= b.mhzHigh);
  if (match) {
    matchText = `<span class="match-yes">✓ 在頻段內：${match.name}（${match.freq}）</span>`;
    detailText = `二等功率限制：<b>${match.pw2}</b><br>三等可用：<b>${match.grade3 ? '✓ ' + match.pw3 : '✗ 不可使用'}</b>`
      + (match.restriction ? `<br><span style="color:var(--rose-ink)">⚠ ${match.restriction}</span>` : '')
      + (match.emerg && Math.abs(mhz - match.emerg) < 1 ? `<br><span style="color:var(--rose-ink)">⚠ 緊急救難頻率附近，請注意規定</span>` : '')
      + `<br>允許發射方式：<b>${match.modes.join('、')}</b>`;
  }

  res.style.display = 'block';
  document.getElementById('fc-freq-display').textContent = freqStr;
  document.getElementById('fc-detail').innerHTML = `波長：<b>${lambda} m</b> ｜ 半波偶極：<b>${(142.5/mhz).toFixed(2)} m</b><br>${detailText}`;
  document.getElementById('fc-match').innerHTML = matchText;
}

function switchView(v, btn) {
  ['spectrum','table','calc'].forEach(name => {
    const el = document.getElementById('view-' + name);
    if (el) el.style.display = name === v ? 'block' : 'none';
  });
  if (btn) {
    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
  }
}

buildSpectrums();
buildTable();
</script>
</body>
</html>
