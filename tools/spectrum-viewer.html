<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業餘頻段互動頻譜 — 二等業餘無線電</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07100a;
  --surface: #0d1a10;
  --surface2: #122018;
  --border: #1a3020;
  --green: #00ff88;
  --amber: #ffb830;
  --red: #ff4455;
  --blue: #00aaff;
  --purple: #cc88ff;
  --text: #b8d8c0;
  --text-dim: #4a7055;
  --mono: 'Share Tech Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle at 20% 50%, rgba(0,255,136,0.03) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0,170,255,0.03) 0%, transparent 50%);
  pointer-events: none;
}

.container { max-width: 1000px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }

header {
  text-align: center;
  padding: 28px 0 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
header .badge {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--green);
  border: 1px solid var(--green);
  display: inline-block;
  padding: 3px 12px;
  margin-bottom: 10px;
}
header h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 5px; }
header p { color: var(--text-dim); font-size: 13px; }

/* View toggle */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.vtab {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
}
.vtab:hover { border-color: var(--green); color: var(--green); }
.vtab.active { border-color: var(--green); background: rgba(0,255,136,0.08); color: var(--green); }

/* Spectrum view */
.spectrum-container {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 20px;
  overflow-x: auto;
}
.spectrum-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.band-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  min-width: 600px;
}
.band-label {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--amber);
  width: 80px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 12px;
}
.band-track {
  flex: 1;
  height: 28px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  position: relative;
  cursor: pointer;
}
.band-segment {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  transition: filter 0.2s;
  overflow: hidden;
}
.band-segment:hover { filter: brightness(1.3); }
.band-segment.mode-cw { background: rgba(0,170,255,0.4); border-right: 1px solid rgba(0,170,255,0.3); }
.band-segment.mode-data { background: rgba(0,255,136,0.3); border-right: 1px solid rgba(0,255,136,0.2); }
.band-segment.mode-all { background: rgba(255,184,48,0.3); border-right: 1px solid rgba(255,184,48,0.2); }
.band-segment.mode-phone { background: rgba(204,136,255,0.35); }
.band-segment.mode-emerg { background: rgba(255,68,85,0.45); }

.seg-text { color: rgba(255,255,255,0.7); font-size: 9px; letter-spacing: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }

.band-info {
  width: 120px;
  flex-shrink: 0;
  padding-left: 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
}

/* Detail panel */
.detail-panel {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  padding: 20px;
  margin-bottom: 20px;
  display: none;
}
.detail-panel.show { display: block; }
.detail-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
.detail-freq {
  font-family: var(--mono);
  font-size: 22px;
  color: var(--green);
}
.detail-name {
  font-size: 13px;
  color: var(--text);
  margin-top: 2px;
}
.detail-grade {
  display: flex;
  gap: 6px;
}
.grade-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 4px 10px;
  border: 1px solid;
}
.grade-1 { border-color: #ffb830; color: #ffb830; background: rgba(255,184,48,0.1); }
.grade-2 { border-color: #00aaff; color: #00aaff; background: rgba(0,170,255,0.1); }
.grade-3 { border-color: #00ff88; color: #00ff88; background: rgba(0,255,136,0.1); }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}
@media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr 1fr; } }

.detail-cell {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  padding: 12px;
}
.detail-cell-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.detail-cell-val {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text);
}
.detail-cell-val.highlight { color: var(--amber); }
.detail-cell-val.power1 { color: var(--red); }
.detail-cell-val.power2 { color: var(--blue); }
.detail-cell-val.power3 { color: var(--green); }

.modes-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 12px;
}
.mode-tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.mode-tag.active { border-color: var(--amber); color: var(--amber); background: rgba(255,184,48,0.1); }

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  margin-bottom: 20px;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.legend-color { width: 16px; height: 10px; }

/* Quick lookup table */
.lookup-panel { display: none; }
.lookup-panel.active { display: block; }

.big-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 12px;
}
.big-table th {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: var(--surface2);
}
.big-table td {
  padding: 9px 12px;
  border-bottom: 1px solid rgba(26,48,32,0.5);
  vertical-align: top;
}
.big-table tr:hover td { background: rgba(0,255,136,0.03); }
.big-table .freq { color: var(--amber); }
.big-table .band-m { color: var(--text-dim); font-size: 11px; }
.big-table .pw1 { color: var(--red); }
.big-table .pw2 { color: var(--blue); }
.big-table .pw3 { color: var(--green); }
.big-table .restriction {
  font-size: 11px;
  color: var(--red);
  margin-top: 3px;
  display: block;
}

/* Freq calc section */
.freq-calc { display: none; }
.freq-calc.active { display: block; }
.input-row {
  display: flex;
  align-items: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.input-row:focus-within { border-color: var(--green); }
.input-row label { font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 10px 14px; min-width: 140px; letter-spacing: 1px; }
.input-row input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-family: var(--mono); font-size: 15px; padding: 10px 0; }
.input-row .unit { padding: 10px 14px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); border-left: 1px solid var(--border); }
.result-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  padding: 18px;
  font-family: var(--mono);
}
.result-card .rc-freq { font-size: 22px; color: var(--green); margin-bottom: 10px; }
.result-card .rc-detail { font-size: 12px; color: var(--text-dim); line-height: 2; }
.result-card .rc-detail span { color: var(--amber); }
.result-card .rc-match { 
  margin-top: 12px; padding-top: 12px; 
  border-top: 1px solid var(--border);
  font-size: 11px;
}
.match-yes { color: var(--green); }
.match-no { color: var(--red); }

/* Emergency frequencies highlight */
.emerg-note {
  background: rgba(255,68,85,0.08);
  border: 1px solid rgba(255,68,85,0.3);
  border-left: 3px solid var(--red);
  padding: 12px 16px;
  margin-bottom: 16px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
}
.emerg-note strong { color: var(--red); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="badge">二等業餘無線電 輔助學習</div>
    <h1>業餘頻段互動頻譜</h1>
    <p>對應「無線電規章與相關法規」題庫 · 點擊頻段查看詳細規定</p>
  </header>

  <div class="emerg-note">
    <strong>⚠ 緊急救難頻率：</strong> 145 MHz 及 433 MHz 為呼叫及緊急救難頻率，任何電臺呼叫完畢後須改換他頻，<strong>不得停留佔用及干擾</strong>
  </div>

  <div class="view-toggle">
    <div class="vtab active" onclick="switchView('spectrum')">視覺頻譜</div>
    <div class="vtab" onclick="switchView('table')">完整列表</div>
    <div class="vtab" onclick="switchView('calc')">頻率查詢</div>
  </div>

  <!-- SPECTRUM VIEW -->
  <div id="view-spectrum">
    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,170,255,0.5)"></div>電報/數據</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(0,255,136,0.4)"></div>數據/無線打字</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,184,48,0.4)"></div>電報+電話+影像</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(204,136,255,0.45)"></div>電話為主</div>
      <div class="legend-item"><div class="legend-color" style="background:rgba(255,68,85,0.5)"></div>緊急/救難</div>
    </div>

    <div class="spectrum-container">
      <div class="spectrum-title">點擊任一頻段查看詳細規定 — HF 頻段</div>
      <div id="hf-spectrum"></div>
      <div class="spectrum-title" style="margin-top:20px">VHF / UHF 頻段</div>
      <div id="vhf-spectrum"></div>
    </div>

    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <div>
          <div class="detail-freq" id="dp-freq"></div>
          <div class="detail-name" id="dp-name"></div>
        </div>
        <div class="detail-grade" id="dp-grades"></div>
      </div>
      <div class="detail-grid" id="dp-grid"></div>
      <div class="modes-list" id="dp-modes"></div>
    </div>
  </div>

  <!-- TABLE VIEW -->
  <div id="view-table" class="lookup-panel">
    <table class="big-table">
      <thead>
        <tr>
          <th>頻段 (MHz)</th>
          <th>俗稱</th>
          <th>一等功率</th>
          <th>二等功率</th>
          <th>三等功率</th>
          <th>允許發射方式</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- FREQ CALC VIEW -->
  <div id="view-calc" class="freq-calc">
    <div class="input-row">
      <label>輸入頻率</label>
      <input type="number" id="fc-freq" placeholder="例：14200" oninput="lookupFreq()" step="any">
      <div class="unit" id="fc-unit">kHz</div>
    </div>
    <div class="view-toggle" style="margin-bottom:16px">
      <div class="vtab active" onclick="setFcUnit('kHz')">kHz</div>
      <div class="vtab" onclick="setFcUnit('MHz')">MHz</div>
    </div>
    <div class="result-card" id="fc-result" style="display:none">
      <div class="rc-freq" id="fc-freq-display"></div>
      <div class="rc-detail" id="fc-detail"></div>
      <div class="rc-match" id="fc-match"></div>
    </div>
  </div>

</div>

<script>
// ═══ DATA ═══
const bands = [
  { freq: '0.1357-0.1378 MHz', mhzLow: 0.1357, mhzHigh: 0.1378, name: '136kHz 低頻', meters: '2200m', pw1: '1W↓ EIRP', pw2: '1W↓ EIRP', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, special: '超長波，極少使用' },
  { freq: '1.8-1.9 MHz', mhzLow: 1.8, mhzHigh: 1.9, name: '160 公尺頻段', meters: '160m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '3.5-3.5125 MHz', mhzLow: 3.5, mhzHigh: 3.5125, name: '80 公尺頻段（下段）', meters: '80m', pw1: '1500W↓', pw2: '200W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '3.55-3.5625 MHz', mhzLow: 3.55, mhzHigh: 3.5625, name: '80 公尺頻段（上段）', meters: '80m', pw1: '1500W↓', pw2: '200W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '7.0-7.025 MHz', mhzLow: 7.0, mhzHigh: 7.025, name: '40 公尺頻段（下段）', meters: '40m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '7.025-7.2 MHz', mhzLow: 7.025, mhzHigh: 7.2, name: '40 公尺頻段（上段）', meters: '40m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '10.13-10.15 MHz', mhzLow: 10.13, mhzHigh: 10.15, name: '30 公尺頻段', meters: '30m', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務及影像' },
  { freq: '14.0-14.35 MHz', mhzLow: 14.0, mhzHigh: 14.35, name: '20 公尺頻段', meters: '20m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '18.068-18.168 MHz', mhzLow: 18.068, mhzHigh: 18.168, name: '17 公尺頻段', meters: '17m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '21.0-21.025 MHz', mhzLow: 21.0, mhzHigh: 21.025, name: '15 公尺頻段（下段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false, restriction: '禁止話務' },
  { freq: '21.025-21.2 MHz', mhzLow: 21.025, mhzHigh: 21.2, name: '15 公尺頻段（中段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','無線打字','數據'], grade3: false },
  { freq: '21.2-21.45 MHz', mhzLow: 21.2, mhzHigh: 21.45, name: '15 公尺頻段（上段）', meters: '15m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '24.89-24.99 MHz', mhzLow: 24.89, mhzHigh: 24.99, name: '12 公尺頻段', meters: '12m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','電話','影像','無線打字','數據'], grade3: false },
  { freq: '28.0-29.7 MHz', mhzLow: 28.0, mhzHigh: 29.7, name: '10 公尺頻段', meters: '10m', pw1: '1500W↓', pw2: '600W↓', pw3: '—', modes: ['電報','調頻電話','電話','影像','無線打字','數據','示標','中繼','衛星業餘'], grade3: false },
  { freq: '50.0-50.15 MHz', mhzLow: 50.0, mhzHigh: 50.15, name: '6 公尺頻段', meters: '6m', pw1: '1500W↓', pw2: '600W↓', pw3: '25W↓', modes: ['電報','調變電報','電話','影像','無線打字','數據','衛星業餘'], grade3: true },
  { freq: '144-146 MHz', mhzLow: 144, mhzHigh: 146, name: '2 公尺頻段', meters: '2m', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['電報','調變電報','電話(SSB)','影像','無線打字','數據','EME','測試','衛星業餘'], grade3: true, emerg: 145 },
  { freq: '430-432 MHz', mhzLow: 430, mhzHigh: 432, name: '70 公分頻段（下段）', meters: '70cm', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['電報','調變電報','電話(SSB)','影像','無線打字','數據','展頻','EME','測試'], grade3: true },
  { freq: '432-440 MHz', mhzLow: 432, mhzHigh: 440, name: '70 公分頻段（上段）', meters: '70cm', pw1: '200W↓', pw2: '200W↓', pw3: '25W↓', modes: ['調變電報','電話','影像','無線打字','數據','展頻','EME','緊急/求救','中繼','衛星業餘'], grade3: true, emerg: 433 },
  { freq: '1260-1265 MHz', mhzLow: 1260, mhzHigh: 1265, name: '23 公分頻段', meters: '23cm', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','調變電報','電話','影像','無線打字','數據','展頻','測試','衛星業餘'], grade3: false },
  { freq: '2440-2450 MHz', mhzLow: 2440, mhzHigh: 2450, name: '13 公分頻段', meters: '13cm', pw1: '200W↓', pw2: '200W↓', pw3: '—', modes: ['電報','調變電報','電話','影像','無線打字','數據','展頻','測試','脈衝','衛星業餘'], grade3: false },
];

// HF bands (< 100 MHz)
const hfBands = bands.filter(b => b.mhzHigh <= 30);
const vhfBands = bands.filter(b => b.mhzLow >= 50);

function getModeClass(band) {
  const m = band.modes;
  if (band.emerg) return 'mode-emerg';
  if (m.includes('電話') || m.includes('電話(SSB)')) return 'mode-all';
  if (m.includes('數據') && !m.includes('電話')) return 'mode-data';
  return 'mode-cw';
}

function buildSpectrumRow(band, container, logScale) {
  const row = document.createElement('div');
  row.className = 'band-row';

  const label = document.createElement('div');
  label.className = 'band-label';
  label.textContent = band.meters;

  const track = document.createElement('div');
  track.className = 'band-track';

  const seg = document.createElement('div');
  seg.className = 'band-segment ' + getModeClass(band);
  seg.style.left = '0'; seg.style.right = '0';

  const txt = document.createElement('span');
  txt.className = 'seg-text';
  txt.textContent = band.freq;
  seg.appendChild(txt);

  seg.onclick = () => showDetail(band);
  track.appendChild(seg);

  const info = document.createElement('div');
  info.className = 'band-info';
  info.textContent = '2等: ' + band.pw2;

  row.appendChild(label);
  row.appendChild(track);
  row.appendChild(info);
  container.appendChild(row);
}

function buildSpectrums() {
  const hfEl = document.getElementById('hf-spectrum');
  const vhfEl = document.getElementById('vhf-spectrum');
  hfBands.forEach(b => buildSpectrumRow(b, hfEl));
  vhfBands.forEach(b => buildSpectrumRow(b, vhfEl));
}

function showDetail(band) {
  const panel = document.getElementById('detail-panel');
  panel.classList.add('show');

  document.getElementById('dp-freq').textContent = band.freq;
  document.getElementById('dp-name').textContent = band.name + (band.emerg ? ' ⚠ 含緊急頻率' : '');

  // Grades
  const gradesEl = document.getElementById('dp-grades');
  gradesEl.innerHTML = '';
  const g1 = document.createElement('div'); g1.className='grade-badge grade-1'; g1.textContent='一等'; gradesEl.appendChild(g1);
  const g2 = document.createElement('div'); g2.className='grade-badge grade-2'; g2.textContent='二等'; gradesEl.appendChild(g2);
  if (band.grade3) { const g3 = document.createElement('div'); g3.className='grade-badge grade-3'; g3.textContent='三等'; gradesEl.appendChild(g3); }

  // Grid
  const grid = document.getElementById('dp-grid');
  grid.innerHTML = '';
  const cells = [
    { label: '一等功率', val: band.pw1, cls: 'power1' },
    { label: '二等功率', val: band.pw2, cls: 'power2' },
    { label: '三等功率', val: band.grade3 ? band.pw3 : '不得使用', cls: 'power3' },
    { label: '頻段寬度', val: ((band.mhzHigh - band.mhzLow) * 1000).toFixed(1) + ' kHz', cls: 'highlight' },
    { label: '波段俗稱', val: band.meters, cls: '' },
    { label: '功率基準', val: band.mhzLow < 0.2 ? 'EIRP' : 'PEP', cls: '' },
  ];
  cells.forEach(c => {
    const cell = document.createElement('div'); cell.className='detail-cell';
    cell.innerHTML = `<div class="detail-cell-label">${c.label}</div><div class="detail-cell-val ${c.cls}">${c.val}</div>`;
    grid.appendChild(cell);
  });

  // Modes
  const modesEl = document.getElementById('dp-modes');
  modesEl.innerHTML = '<span style="font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin-right:8px">發射方式：</span>';
  band.modes.forEach(m => {
    const tag = document.createElement('span');
    tag.className = 'mode-tag active';
    tag.textContent = m;
    modesEl.appendChild(tag);
  });

  if (band.restriction) {
    const note = document.createElement('div');
    note.style.cssText = 'margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--red);padding:8px 12px;border:1px solid rgba(255,68,85,0.3);background:rgba(255,68,85,0.06)';
    note.textContent = '⚠ 限制：' + band.restriction;
    modesEl.appendChild(note);
  }

  if (band.emerg) {
    const note = document.createElement('div');
    note.style.cssText = 'margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--red);padding:8px 12px;border:1px solid rgba(255,68,85,0.3);background:rgba(255,68,85,0.06)';
    note.textContent = `⚠ ${band.emerg} MHz 為緊急救難呼叫頻率，呼叫後立即移頻，不得停留`;
    modesEl.appendChild(note);
  }

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// Table view
function buildTable() {
  const tbody = document.getElementById('table-body');
  bands.forEach(b => {
    const tr = document.createElement('tr');
    const modesStr = b.modes.join('、');
    const restrict = b.restriction ? `<span class="restriction">⚠ ${b.restriction}</span>` : '';
    const emergNote = b.emerg ? `<span class="restriction">⚠ ${b.emerg}MHz 緊急頻率</span>` : '';
    tr.innerHTML = `
      <td><span class="freq">${b.freq}</span></td>
      <td><span class="band-m">${b.meters}</span> ${b.name}</td>
      <td class="pw1">${b.pw1}</td>
      <td class="pw2">${b.pw2}</td>
      <td class="pw3">${b.grade3 ? b.pw3 : '<span style="color:var(--text-dim)">不可用</span>'}</td>
      <td style="font-size:11px;color:var(--text-dim)">${modesStr}${restrict}${emergNote}</td>
    `;
    tr.onclick = () => { switchView('spectrum'); showDetail(b); };
    tr.style.cursor = 'pointer';
    tbody.appendChild(tr);
  });
}

// Freq calculator
let fcUnit = 'kHz';
function setFcUnit(u) {
  fcUnit = u;
  document.querySelectorAll('.view-toggle .vtab').forEach((el,i) => el.classList.toggle('active', (u==='kHz'&&i===0)||(u==='MHz'&&i===1)));
  document.getElementById('fc-unit').textContent = u;
  lookupFreq();
}

function lookupFreq() {
  const raw = parseFloat(document.getElementById('fc-freq').value);
  const res = document.getElementById('fc-result');
  if (isNaN(raw)) { res.style.display='none'; return; }

  const mhz = fcUnit === 'kHz' ? raw / 1000 : raw;
  const khz = mhz * 1000;

  let freqStr = mhz >= 1 ? `${mhz.toFixed(3)} MHz` : `${khz.toFixed(3)} kHz`;
  const lambda = (300 / mhz).toFixed(2);

  let matchText = '<span class="match-no">此頻率不在台灣二等業餘分配頻段內</span>';
  let detailText = '';

  const match = bands.find(b => mhz >= b.mhzLow && mhz <= b.mhzHigh);
  if (match) {
    matchText = `<span class="match-yes">✓ 在頻段內：${match.name}（${match.freq}）</span>
    <br>二等功率限制：<span>${match.pw2}</span>
    <br>三等可用：<span>${match.grade3 ? '✓ ' + match.pw3 : '✗ 不可使用'}</span>
    ${match.restriction ? `<br><span style="color:var(--red)">⚠ ${match.restriction}</span>` : ''}
    ${match.emerg && Math.abs(mhz - match.emerg) < 1 ? `<br><span style="color:var(--red)">⚠ 緊急救難頻率附近，請注意規定</span>` : ''}`;
    detailText = `允許發射方式：<span>${match.modes.join('、')}</span>`;
  }

  res.style.display = 'block';
  document.getElementById('fc-freq-display').textContent = freqStr;
  document.getElementById('fc-detail').innerHTML = `波長：<span>${lambda} m</span>&nbsp;&nbsp;|&nbsp;&nbsp;半波偶極：<span>${(142.5/mhz).toFixed(2)} m</span><br>${detailText}`;
  document.getElementById('fc-match').innerHTML = matchText;
}

// View switching
function switchView(v) {
  ['spectrum','table','calc'].forEach(name => {
    const el = document.getElementById('view-' + name);
    if (el) el.style.display = name === v ? 'block' : 'none';
  });
  document.querySelectorAll('.view-toggle .vtab').forEach((el, i) => {
    el.classList.toggle('active', ['spectrum','table','calc'][i] === v);
  });
}

// Init
buildSpectrums();
buildTable();
</script>
</body>
</html>
